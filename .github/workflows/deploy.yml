name: Auto Deploy Workflow

# 1. 触发条件
on:
  push:
    branches: [ "main" ]  # 当推送到 main 分支时触发
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 (北京时间 08:00) 定时触发
  workflow_dispatch:       # 支持在 GitHub 界面手动点击运行

jobs:
  run-task:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行节点

    steps:
    # 步骤 1：拉取仓库代码
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 步骤 2：配置运行环境（以 Python 为例）
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 步骤 3：安装依赖（如有）
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 步骤 4：执行核心部署或运行脚本
    - name: Run script
      run: python main.py
      env:
        # 引入加密密钥
        MY_SECRET: ${{ secrets.MY_SECRET_KEY }}

    # 步骤 5：（可选）自动将脚本生成的文件提交保存回仓库
    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "Auto updated by GitHub Actions" || exit 0
        git push
