name: Auto Fetch Nodes

# 触发条件
on:
  workflow_dispatch:        # 仅保留这一行，代表只允许在网页端手动点击触发

jobs:
  run-task:
    runs-on: ubuntu-latest
    
    # 👇 关键修改：添加以下两行，授予工作流写入权限
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run node fetcher
        run: python IPOW.py -o ./

      - name: Commit and Push generated configs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add all_nodes_vless.txt clash_proxies.yaml singbox_outbounds.json all_nodes.json auto_wallets.json
          git commit -m "Auto update nodes [skip ci]" || exit 0
          git push
